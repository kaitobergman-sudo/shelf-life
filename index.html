<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Life Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DotGothic16&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: one phone centered on a cool countertop backdrop, with a slim notes column beside it on wide screens.
   The phone is a deliberate light-mode app; only the backdrop follows the viewer's theme. */
:root{
  --page:#E2E8E5; --page-ink:#18211E; --page-muted:#56645F; --page-line:#C7D1CD; --page-card:#F1F5F3;
  --bezel:#121816; --bezel-edge:#2C3532;
  --frost:#EEF3F1; --card:#FFFFFF; --ink:#16201D; --muted:#5B6964; --faint:#879590; --line:#DCE4E1;
  --accent:#1F5A4B; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4; --accent-bright:#9FD9C4;
  --useby:#B23A2C; --useby-soft:#FBE4E0; --bestby:#8E5C0E; --bestby-soft:#F7ECD6; --soon:#B4531A;
  --night:#0C1513; --on-dark:#FFFFFF; --on-dark-muted:#A9BAB4; --scrim:rgba(12,22,19,.45);
  --paper:#F6F0E1; --paper-ink:#4A4436; --cheese:#F2C94C; --cheese-ink:#5A4410;
  --map:#DCE8E2; --map-road:#FFFFFF; --map-water:#C6DDE6;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-stamp:"DotGothic16",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0E1412; --page-ink:#E3EBE7; --page-muted:#93A29C; --page-line:#2A3531; --page-card:#161E1B; --bezel:#050807; --bezel-edge:#34403C; color-scheme:dark }
}
:root[data-theme="dark"]{ --page:#0E1412; --page-ink:#E3EBE7; --page-muted:#93A29C; --page-line:#2A3531; --page-card:#161E1B; --bezel:#050807; --bezel-edge:#34403C; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ol,ul{margin:0}

/* backdrop + notes column */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px}
.side{width:250px;display:flex;flex-direction:column;gap:16px}
.side-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted);font-weight:600}
.side-t{font-family:var(--f-display);font-size:44px;line-height:.95;font-weight:800;letter-spacing:-.025em}
.side-stamp{font-family:var(--f-stamp);font-size:13px;letter-spacing:.08em;color:var(--page-muted)}
.side-d{color:var(--page-muted);max-width:30ch}
.side-f{display:flex;flex-direction:column;gap:6px}
.side-f label{font-size:13px;font-weight:600}
.side select,.side-btn{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--page-line);background:var(--page-card);color:var(--page-ink);font-weight:600}
.side-btn{text-align:center}
.side-btn:hover{border-color:var(--page-muted)}

/* phone */
.phone{position:relative;flex:none;width:390px;height:min(844px,calc(100dvh - 48px));min-height:640px;border-radius:50px;background:var(--frost);color:var(--ink);color-scheme:light;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 11px var(--bezel),0 0 0 12px var(--bezel-edge),0 40px 70px -28px rgba(8,18,14,.55);isolation:isolate}
.phone[data-dark]{background:var(--night)}
.sbar{flex:none;height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px 0 36px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.sbar .island{width:112px;height:32px;border-radius:20px;background:var(--bezel)}
.sbar .sb-ic{justify-self:end;display:flex;gap:6px;align-items:center}
.sbar svg{height:12px;width:auto}
.phone[data-dark] .sbar{color:var(--on-dark)}
#app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.i{width:22px;height:22px;flex:none}
.i.xs{width:15px;height:15px;vertical-align:-3px}

/* headers */
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:4px 12px 6px}
.hdr-t{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.steps{display:flex;gap:5px;width:140px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps-l{font-size:12px;color:var(--muted);font-weight:600}
.thdr{flex:none;display:flex;align-items:flex-end;gap:8px;padding:6px 16px 10px}
.thdr-txt{flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.iconbtn:hover{background:var(--line)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.big{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.025em;line-height:1.05}
.h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.center{text-align:center}
.ob-t{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.dot{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--useby);color:var(--on-dark);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}

/* scroll + foot */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.scroll.center{align-items:stretch;justify-content:center;text-align:center}
.foot{flex:none;padding:12px 16px 26px;display:flex;flex-direction:column;gap:8px;background:var(--frost);border-top:1px solid var(--line)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:700;font-size:16px;padding:0 18px;width:100%;text-align:center}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{color:var(--accent)}
.btn.outline{background:var(--card);border:1.5px solid var(--line)}
.btn.outline:hover{border-color:var(--faint)}
.btn.danger{background:var(--useby);color:var(--on-dark)}
.btn.danger-o{background:var(--card);border:1.5px solid var(--useby);color:var(--useby)}
.btn.danger-t{color:var(--useby);min-height:44px}
.txtbtn{color:var(--accent);font-weight:700;padding:8px 6px;display:inline-flex;align-items:center;gap:5px}
.txtbtn.sm{font-size:13px;padding:4px 0}
.linkbtn{color:var(--accent);font-weight:700;align-self:flex-start;padding:4px 0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.linkbtn.inline{display:inline;padding:0;font-size:inherit}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.searchbar{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--card);padding:0 14px;color:var(--muted);width:100%;flex:none}
.searchbar.live{flex:1;color:var(--ink)}
.searchbar .q{flex:1;border:0;background:none;outline:none;height:100%;min-width:0;font-size:16px}
.filters{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-n{font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.sec.alert .sec-t{color:var(--useby)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid.g3{grid-template-columns:repeat(3,1fr);gap:8px}
.flist{display:flex;flex-direction:column;gap:8px}
.food{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;border:1.5px solid transparent}
.food:hover{border-color:var(--line)}
.food-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.food-name{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.food-meta{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.food.grid3{padding:10px;gap:8px}
.food.grid3 .food-name{font-size:13px}
.food.grid3 .badge{display:none}
.food.grid3 .st{font-size:12px}
.food.list{flex-direction:row;align-items:center;gap:12px}
.food.list .food-meta{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.tile.sm{width:36px;height:36px;border-radius:10px}
.tile.sm .i{width:19px;height:19px}
.tile.xl{width:68px;height:68px;border-radius:18px}
.tile.xl .i{width:34px;height:34px}
.food.grid3 .tile{width:36px;height:36px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.use{background:var(--useby-soft);color:var(--useby)}
.badge.best{background:var(--bestby-soft);color:var(--bestby)}
.st{font-size:13px;color:var(--muted);font-weight:500}
.st.bad{color:var(--useby);font-weight:700}
.st.warn{color:var(--bestby);font-weight:700}
.st.soon{color:var(--soon);font-weight:700}
.st.big{font-size:16px}
.stamp{font-family:var(--f-stamp);letter-spacing:.06em;font-size:12px}
.stamp.use{color:var(--useby)}.stamp.best{color:var(--bestby)}
.empty{background:var(--card);border-radius:16px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.empty-t{font-weight:700}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.muted{color:var(--muted);font-size:13px}
.pad{padding:8px 0}

/* item detail */
.item-hero{display:flex;align-items:center;gap:14px}
.labelcard{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--useby)}
.labelcard.best{border-top-color:var(--bestby)}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.infobtn{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px}
.infobtn .i{width:18px;height:18px}
.bigstamp{font-family:var(--f-stamp);font-size:27px;letter-spacing:.07em;line-height:1.1}
.bigstamp.sm{font-size:19px}
.bigstamp.use{color:var(--useby)}.bigstamp.best{color:var(--bestby)}
.photo-row{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px dashed var(--line)}
.photo-row .sub{font-size:13px}
.labelphoto{width:74px;height:54px;flex:none;border-radius:8px;background:var(--paper);display:grid;place-items:center;transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.labelphoto span{font-family:var(--f-stamp);font-size:8.5px;color:var(--paper-ink);text-align:center;line-height:1.2;padding:0 4px}

/* rows + groups */
.group{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;min-height:58px;text-align:left}
.group>.row+.row,.group>*+.row,.group>.row+*{border-top:1px solid var(--line)}
button.row:hover{background:var(--frost)}
.row-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row-ic .i{width:20px;height:20px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font-weight:600;line-height:1.25}
.row-s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-s.ok{color:var(--accent);font-weight:600}
.row-chev{color:var(--faint);width:18px;height:18px}
.sw{width:48px;height:29px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(19px)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--frost);border-radius:12px;padding:3px;flex:none}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--card);font-size:19px;font-weight:700;display:grid;place-items:center;line-height:1}
.stepper output{min-width:68px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border-radius:9px;font-weight:700;font-size:14px;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.radio.on{border:7px solid var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.lab{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.input{height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;width:100%;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.est{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.02em}
.datecard{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:12px;padding:12px 14px}
.found{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{height:40px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13px;text-align:center}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.every{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:10px 14px;font-weight:600}

/* welcome */
.wel{justify-content:center;gap:30px}
.wel-art{position:relative;height:210px}
.tag{position:absolute;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 16px 12px 12px;box-shadow:0 10px 24px -14px rgba(10,30,24,.35)}
.tag b{display:block;font-size:15px}
.tag.t1{left:6px;top:4px;transform:rotate(-4deg)}
.tag.t2{right:2px;top:72px;transform:rotate(3deg)}
.tag.t3{left:30px;top:142px;transform:rotate(-1.5deg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-stamp);display:grid;place-items:center;font-size:15px;letter-spacing:.04em;flex:none}
.logo.xs{width:20px;height:20px;border-radius:6px;font-size:9px}
.wel-h{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.03em;text-wrap:balance}
.wel-copy{display:flex;flex-direction:column;gap:12px}

/* nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 24px}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);padding:6px 0;text-align:center}
.nav-b[aria-current="page"]{color:var(--accent)}
.nav-b .i{width:24px;height:24px}
.nav-plus{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 2px;box-shadow:0 8px 18px -8px rgba(20,70,56,.7)}
.nav-plus .i{width:28px;height:28px}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--frost);border-radius:26px 26px 0 0;padding:10px 16px 28px;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;animation:up .26s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.modal{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);z-index:21;background:var(--frost);border-radius:24px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;animation:fade .2s ease-out}
.explain{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--useby)}
.explain.best{border-left-color:var(--bestby)}
.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lay{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;text-align:center}
.lay[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.toast{position:absolute;left:16px;right:16px;bottom:28px;z-index:40;background:var(--ink);color:var(--on-dark);border-radius:14px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;animation:up .2s ease-out;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.phone[data-nav] .toast{bottom:104px}
.toast-a{color:var(--accent-bright);font-weight:800;padding:2px 4px}
@keyframes up{from{transform:translateY(18px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* add sheet options */
.addopt .row-ic{width:42px;height:42px;border-radius:12px}

/* scanner */
.cam{background:var(--night);color:var(--on-dark);align-items:center;justify-content:space-between;padding:0 16px 28px}
.cam-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;padding-top:4px}
.cam-top .iconbtn:hover{background:rgba(255,255,255,.12)}
.cam-hint{font-weight:600;font-size:14px;text-align:center;color:var(--on-dark-muted)}
.vf{position:relative;width:270px;height:200px;display:grid;place-items:center}
.vf.tall{height:330px;width:240px}
.vf .c{position:absolute;width:30px;height:30px;border:3px solid var(--on-dark)}
.vf .tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.vf .tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf .bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.vf .br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanline{position:absolute;left:14px;right:14px;height:2px;background:var(--accent-bright);box-shadow:0 0 12px var(--accent-bright);top:50%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{from{top:14%}to{top:86%}}
.pkg{width:200px;height:130px;background:var(--cheese);color:var(--cheese-ink);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-2deg)}
.pkg-name{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em;line-height:1}
.pkg-w{font-size:12px;font-weight:700}
.pkg-bar{height:34px;width:110px;background:repeating-linear-gradient(90deg,var(--cheese-ink) 0 2px,transparent 2px 4px,var(--cheese-ink) 4px 5px,transparent 5px 8px,var(--cheese-ink) 8px 11px,transparent 11px 12px);border-radius:2px}
.pkg-date{font-family:var(--f-stamp);font-size:11px;letter-spacing:.06em}
.rcpt{width:190px;background:var(--paper);color:var(--paper-ink);padding:14px 14px 18px;font-family:var(--f-stamp);font-size:10.5px;letter-spacing:.03em;display:flex;flex-direction:column;gap:4px;transform:rotate(1.5deg);clip-path:polygon(0 0,100% 0,100% 100%,92% 97%,84% 100%,76% 97%,68% 100%,60% 97%,52% 100%,44% 97%,36% 100%,28% 97%,20% 100%,12% 97%,4% 100%,0 97%)}
.rcpt b{font-size:13px;text-align:center;margin-bottom:6px}
.rcpt span{display:flex;justify-content:space-between}
.rcpt .tot{border-top:1px dashed var(--paper-ink);padding-top:5px;margin-top:4px;font-weight:700}
.cam-ctl{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.seg.dark{background:rgba(255,255,255,.12);width:220px}
.seg.dark button{color:var(--on-dark-muted)}
.seg.dark button[aria-pressed="true"]{background:var(--on-dark);color:var(--night)}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--on-dark);display:grid;place-items:center}
.shutter span{width:58px;height:58px;border-radius:50%;background:var(--on-dark);transition:transform .15s}
.shutter:active span{transform:scale(.9)}

/* review rows */
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--card)}
.ck .i{width:16px;height:16px;stroke-width:3}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.off .row-t{color:var(--faint)}
.row.imp{padding-right:6px}

/* notifications */
.nlist{display:flex;flex-direction:column;gap:10px}
.nrow{background:var(--card);border-radius:16px;overflow:hidden;position:relative}
.nrow.new::before{content:"";position:absolute;left:7px;top:24px;width:7px;height:7px;border-radius:50%;background:var(--useby)}
.nmain{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 6px 20px;width:100%;text-align:left}
.nmain:hover{background:var(--frost)}
.nic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.nic.bad{background:var(--useby-soft);color:var(--useby)}
.nic.soon{background:var(--bestby-soft);color:var(--bestby)}
.nic .i{width:19px;height:19px}
.ntime{font-size:12px;color:var(--faint);white-space:nowrap;font-weight:600}
.nfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 10px 68px;min-height:12px}
.nrow.handled .row-t{color:var(--faint);text-decoration:line-through}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;background:var(--line);color:var(--muted);font-size:12px;font-weight:700}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.digest{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px 68px}
.digest div{background:var(--frost);border-radius:10px;padding:8px;display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.digest b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* lock screen */
.lock{background:linear-gradient(170deg,#1E3D34 0%,#12241F 45%,#0A1311 100%);color:var(--on-dark);align-items:center;padding:12px 14px 28px;gap:24px}
.lock-top{text-align:center;padding-top:10px}
.lock-date{font-weight:600;font-size:16px;color:var(--on-dark-muted)}
.lock-time{font-family:var(--f-display);font-weight:600;font-size:88px;line-height:1;letter-spacing:-.03em}
.push{width:100%;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;overflow:hidden}
.push-main{display:flex;flex-direction:column;gap:3px;padding:14px 16px;width:100%;text-align:left}
.push-app{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--on-dark-muted)}
.push-now{margin-left:auto;font-weight:600;letter-spacing:0}
.push-t{font-weight:700;font-size:15px;margin-top:4px}
.push-b{font-size:14px;color:var(--on-dark-muted)}
.push-acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.14)}
.push-acts button{padding:12px;font-weight:700;text-align:center}
.push-acts button+button{border-left:1px solid rgba(255,255,255,.14)}
.push-acts button:hover,.push-main:hover{background:rgba(255,255,255,.08)}
.lock-back{margin-top:auto;font-weight:700;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.14)}

/* food banks */
.map{height:180px;border-radius:18px;position:relative;overflow:hidden;background:var(--map);flex:none}
.map .road{position:absolute;background:var(--map-road)}
.map .r1{left:-10%;right:-10%;top:58%;height:12px;transform:rotate(-8deg)}
.map .r2{top:-10%;bottom:-10%;left:38%;width:10px;transform:rotate(12deg)}
.map .r3{top:-10%;bottom:-10%;left:76%;width:8px}
.map .water{position:absolute;right:-30px;bottom:-40px;width:160px;height:110px;border-radius:50%;background:var(--map-water)}
.you{position:absolute;left:45%;top:62%;width:16px;height:16px;border-radius:50%;background:#2F6FE0;border:3px solid var(--card);box-shadow:0 0 0 6px rgba(47,111,224,.2)}
.mpin{position:absolute;color:var(--accent);display:grid;place-items:center}
.mpin .i{width:34px;height:34px;fill:var(--card)}
.mpin b{position:absolute;top:6px;font-size:11px;color:var(--accent)}
.mpin.p1{left:24%;top:24%}.mpin.p2{left:62%;top:14%}.mpin.p3{left:80%;top:56%}
.bank{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bank-h{display:flex;gap:12px;align-items:flex-start}
.bank-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}
.bank-a{display:flex;gap:8px;flex-wrap:wrap}

/* grocery */
.banner{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.banner .row-s{color:var(--accent-soft)}
.banner .row-chev{color:var(--accent-soft)}
.addrow{display:flex;gap:8px}
.addrow .input{flex:1;min-width:0}
.lrow.done .row-t{text-decoration:line-through;color:var(--faint)}
.have{display:inline-flex;align-items:center;gap:5px;margin-top:4px;align-self:flex-start;background:var(--bestby-soft);color:var(--bestby);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:700;text-align:left}
.have .i{width:15px;height:15px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.totals{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;color:var(--muted)}
.totals .tot{color:var(--ink);font-weight:800;border-top:1px solid var(--line);padding-top:8px}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto}
.bigcheck .i{width:44px;height:44px;stroke-width:2.5}
.i.ok{color:var(--accent)}

/* recipes */
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;width:100%;text-align:left;border:1.5px solid transparent}
.rcard:hover{border-color:var(--line)}
.rthumb{height:96px;display:flex;align-items:center;justify-content:center;gap:18px}
.rthumb .i,.rhero .i{width:38px;height:38px;stroke-width:1.5}
.rbody{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.use{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--frost);color:var(--muted)}
.use.bad{background:var(--useby-soft);color:var(--useby)}
.use.soon,.use.warn{background:var(--bestby-soft);color:var(--bestby)}
.use.gone{text-decoration:line-through;color:var(--faint)}
.rhero{height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:24px;flex:none}
.rhero .i{width:52px;height:52px}
.ing{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps-l{padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps-l li::marker{font-weight:800;color:var(--accent)}

/* profile */
.me{display:flex;align-items:center;gap:14px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.avatar.sm{width:38px;height:38px;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.storelogo{width:36px;height:36px;border-radius:10px;background:var(--frost);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.invite{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.code{font-family:var(--f-stamp);font-size:26px;letter-spacing:.12em}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:560px){
  body{padding-left:0;padding-right:0}

  .hdr,.thdr,.scroll,.foot,.sheet,.cam,.lock{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hdr{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:8px}
  .nav{padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .phone[data-nav] .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}

 routineSave:function(){if(!routineOk())return;back();toast('Reminder saved')},
 place:function(){var items=S.list.filter(function(l){return l.by==='You'&&!l.done});if(!items.length)return;var st=S.ostore||firstStore();S.lastOrder={store:st,items:items.map(function(l){return l.name})};items.forEach(function(l){l.done=true;l.ordered=true});go('C4')},
 rf:function(el){S.rf=el.dataset.v;render()},
 made:function(el){var r=RECIPES.filter(function(x){return x.id===el.dataset.r})[0];var have=r.uses.filter(function(u){return itm(u)});if(!have.length)return;var names=have.map(function(u){return itm(u).name});have.forEach(function(u){removeItem(u)});names.forEach(function(n){addToList(n,'auto','Used up')});S.stats.used+=have.length;S.stats.saved+=3*have.length;tab('B1');toast(listNames(names.map(function(n,i){return i?n.toLowerCase():n}))+' marked used')},
 demo:function(el){toast(el.dataset.msg)}
};

app.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-go],[data-act]');
 if(!el||!app.contains(el))return;
 if(el.disabled)return;
 if(el.dataset.go){ev.preventDefault();var p={};for(var k in el.dataset){if(k!=='go')p[k]=el.dataset[k]}go(el.dataset.go,p);return}
 var f=ACT[el.dataset.act];if(f){ev.preventDefault();f(el,ev)}
});
app.addEventListener('submit',function(ev){ev.preventDefault();var f=ACT[ev.target.dataset.submit];if(f)f()});
app.addEventListener('input',function(ev){
 var t=ev.target;
 if(t.id==='q'){S.q=t.value;var r=document.getElementById('results');if(r)r.innerHTML=searchResults();return}
 if(t.dataset.bind&&t.tagName!=='SELECT')setPath(t.dataset.bind,t.value);
});
app.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.dataset.bindDate){setPath(t.dataset.bindDate,daysFromIso(t.value));if(t.dataset.est)setPath(t.dataset.est,false);render();return}
 if(t.dataset.bind&&t.tagName==='SELECT'){setPath(t.dataset.bind,t.value);if(t.dataset.bind==='manual.cat'&&S.manual.est)S.manual.days=CATS[t.value].est;render()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.ov){S.ov=null;render()}});

/* ---------- jump menu (for teammates recording the video) ---------- */
var ORDER=['A1','A2','A3','A4','A5','A6','A7','A8','A9','A10','A11','B1','B2','B3','B4','B5','B6','B7','B8','B9','B10','B11','C1','C2','C3','C4','C5','C6','C7','C8'];
var BASEOF={A2:'A1',A3:'A1',A4:'A1',A5:'A1',A6:'A1',A8:'B1',A10:'B1',A11:'B1',B2:'B1',B4:'B1',B8:'B1',B9:'B1',B10:'B1',B11:'B1',C2:'C1',C3:'C1',C4:'C1',C6:'C5',C8:'C7'};
function pickId(pref){return itm(pref)?pref:(S.items[0]?S.items[0].id:pref)}
function jumpTo(id){
 S.ov=null;
 if(OVERLAYS.indexOf(id)>=0){S.hist=(id==='B5'||id==='B7')?[{s:'B1',p:{}},{s:'B4',p:{id:pickId(id==='B7'?'yogurt':'chicken')}}]:[{s:'B1',p:{}}];S.ov=id;render();return}
 if(id==='A1'||TABS.indexOf(id)>=0){S.hist=[{s:id,p:{}}];render();return}
 if(id==='A9'){S.draft=scanDraft();S.hist=[{s:'B1',p:{}},{s:'A8',p:{}},{s:'A9',p:{}}];render();return}
 if(id==='B6'){var it=itm(pickId('chicken'));if(it){S.edit={id:it.id,name:it.name,cat:it.cat,loc:it.loc,type:it.type,days:it.days,qty:it.qty}}S.hist=[{s:'B1',p:{}},{s:'B4',p:{id:pickId('chicken')}},{s:'B6',p:{id:pickId('chicken')}}];render();return}
 var p={};
 if(id==='B4')p.id=pickId('chicken');
 if(id==='A6')p.ctx='onboard';
 if(id==='A10')S.imp=mkImp('store');
 if(id==='A11')S.manual=freshManual();
 if(id==='C6')p.r='pasta';
 if(id==='C4'&&!S.lastOrder)S.lastOrder={store:firstStore(),items:S.list.filter(function(l){return l.by==='You'}).map(function(l){return l.name})};
 S.hist=[{s:BASEOF[id]||'B1',p:{}},{s:id,p:p}];render();
}
if(jump){
 jump.innerHTML=[['A','Onboarding and adding food'],['B','Home, items and alerts'],['C','Grocery, recipes and profile']].map(function(g){return '<optgroup label="'+g[1]+'">'+ORDER.filter(function(id){return id[0]===g[0]}).map(function(id){return '<option value="'+id+'">'+id+' · '+NAMES[id]+'</option>'}).join('')+'</optgroup>'}).join('');
 jump.addEventListener('change',function(){jumpTo(jump.value)});
}
var rs=document.getElementById('restart');
if(rs)rs.addEventListener('click',function(){initState();lastEntry=null;render();var t=phone.querySelector('.toast');if(t)t.remove()});

initState();render();
})();
</script>
</body>
